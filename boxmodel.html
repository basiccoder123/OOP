<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model Example</title>
    <style>
        .box {
            width: 300px;
            height: 150px;
            background-color: #4CAF50;
            color: white;
            border: 4px solid #222;
            padding: 20px;
            margin: 40px auto;
            box-sizing: border-box;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="box">
        This is a box using the CSS box model.<br>
        It has margin, border, padding, and a background!
    </div>
</body>
</html></html>
