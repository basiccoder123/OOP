<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perimeter Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; 
            background-color: #ca3232; display: flex; flex-direction: column; align-items: center; }
        .input-group { margin-bottom: 10px; }
        label { margin-right: 10px; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Perimeter Calculator</h2>
    <div>
        <label for="shape">Select Shape:</label>
        <select id="shape">
            <option value="rectangle">Rectangle</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="circle">Circle</option>
        </select>
    </div>
    <form id="inputs"></form>
    <button id="calcBtn">Calculate Perimeter</button>
    <div id="result"></div>

    <script>
        const inputsForm = document.getElementById('inputs');
        const shapeSelect = document.getElementById('shape');
        const resultDiv = document.getElementById('result');

        function renderInputs(shape) {
            let html = '';
            if (shape === 'rectangle') {
                html += `<div class="input-group">
                                    <label>Length:</label>
                                    <input type="number" id="length" min="0" required>
                                </div>
                                <div class="input-group">
                                    <label>Width:</label>
                                    <input type="number" id="width" min="0" required>
                                </div>`;
            } else if (shape === 'square') {
                html += `<div class="input-group">
                                    <label>Side:</label>
                                    <input type="number" id="side" min="0" required>
                                </div>`;
            } else if (shape === 'triangle') {
                html += `<div class="input-group">
                                    <label>Side A:</label>
                                    <input type="number" id="a" min="0" required>
                                </div>
                                <div class="input-group">
                                    <label>Side B:</label>
                                    <input type="number" id="b" min="0" required>
                                </div>
                                <div class="input-group">
                                    <label>Side C:</label>
                                    <input type="number" id="c" min="0" required>
                                </div>`;
            } else if (shape === 'circle') {
                html += `<div class="input-group">
                                    <label>Radius:</label>
                                    <input type="number" id="radius" min="0" required>
                                </div>`;
            }
            inputsForm.innerHTML = html;
        }

        shapeSelect.addEventListener('change', (e) => {
            renderInputs(e.target.value);
            resultDiv.textContent = '';
        });

        renderInputs(shapeSelect.value);

        document.getElementById('calcBtn').addEventListener('click', function(e) {
            e.preventDefault();
            let shape = shapeSelect.value;
            let perimeter = 0;
            if (shape === 'rectangle') {
                let length = parseFloat(document.getElementById('length').value);
                let width = parseFloat(document.getElementById('width').value);
                if (isNaN(length) || isNaN(width)) return resultDiv.textContent = 'Please enter valid numbers.';
                perimeter = 2 * (length + width);
            } else if (shape === 'square') {
                let side = parseFloat(document.getElementById('side').value);
                if (isNaN(side)) return resultDiv.textContent = 'Please enter a valid number.';
                perimeter = 4 * side;
            } else if (shape === 'triangle') {
                let a = parseFloat(document.getElementById('a').value);
                let b = parseFloat(document.getElementById('b').value);
                let c = parseFloat(document.getElementById('c').value);
                if (isNaN(a) || isNaN(b) || isNaN(c)) return resultDiv.textContent = 'Please enter valid numbers.';
                perimeter = a + b + c;
            } else if (shape === 'circle') {
                let radius = parseFloat(document.getElementById('radius').value);
                if (isNaN(radius)) return resultDiv.textContent = 'Please enter a valid number.';
                perimeter = 2 * Math.PI * radius;
            }
            resultDiv.textContent = `Perimeter: ${perimeter.toFixed(2)}`;
        });
    </script>
</body>
</html>
