<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try and Catch</title>
</head>
<body>
    <p>Error Catching</p>

    <p id="error_located"></p>


    <script>
        try {
                addalert("Hello Tinu");
            }

            catch (err) {
                document.getElementById("error_located").innerHTML = err.message;
            }
    </script>
</body>
</html>
