<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Colour Screen</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            width: 100%;
            overflow: hidden;
        }
        body {
            transition: background 0.5s;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1em 2em;
            font-size: 1.2em;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <button id="changeColourBtn">Change Colour</button>
    <script>
        function getRandomColour() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return `rgb(${r},${g},${b})`;
        }

        function changeBackground() {
            document.body.style.background = getRandomColour();
        }

        document.getElementById('changeColourBtn').addEventListener('click', changeBackground);

        changeBackground();
    </script>
</body>
</html></html>
