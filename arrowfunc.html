<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function In JavaScript</title>
</head>
<body>
    <h2>Arrow Function</h2>
    <P>this shows an arrow function with a parameter</P>
    <p id="result"></p>

    <script>

        add = (a,b) => a+b;
        document.getElementById("result").innerHTML = add(4,6);
    </script>
</body>
</html>
