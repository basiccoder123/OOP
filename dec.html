<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div.relative {
            position: relative;
            left: 30px;
            border: 3px solid green;
        }

        div.absolute {
            position: absolute;
            left: 30px;
            border: 3px solid red;
        }

        div.fixed {
            position: fixed;
            left: 30px;
            border: 3px solid blue;
        }

        div.static {
            position: static;
            left: 30px;
            border: 3px solid purple;
        }
    </style>
</head>
<body>
    
    <h2>Positions</h2>
    <p>An element with a relative position</p>
    
    <div class="relative">Relative Positioned Element</div><br>

    <div class="absolute">Absolute Positioned Element</div><br><br>

    <div class="fixed">Fixed Positioned Element</div><br><br>

    <div class="static">Static Positioned Element</div><br>
</body>
</html>
