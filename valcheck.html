<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Enter a number and Click Ok</p>
    <input id="id1" type="number" min="100" max="300" required>
    <button onclick="clickfunction()">Ok</button>
    <p>the number must be more than 100 and less than 300</p>
    <p id="return"></p>

    <script>
            
        function clickfunction() {
            var objI = document.getElementById("id1");
            if (!objI.checkValidity()) {
                document.getElementById("return").innerHTML = 
                objI.validationMessage;
            }
            else {
                document.getElementById("result").innerHTML ="Input OK"
            }
        }
    </script>



</body>
</html>
